name: georeport
description: "Mobile client for GTT-Redmine: capture issues from photos and work on assigned issues in the field."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: any
  latlong2: ^0.10.1
  maplibre: ^0.3.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
