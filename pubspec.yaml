name: georeport
description: "Mobile client for GTT-Redmine: capture issues from photos and work on assigned issues in the field."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.2.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.0
  exif: ^3.3.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: any
  latlong2: ^0.10.1
  maplibre: ^0.3.5
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    # The bundled fonts' license, registered into the LicenseRegistry.
    - fonts/OFL.txt
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansJP
      fonts:
        - asset: fonts/IBMPlexSansJP-Regular.ttf
        - asset: fonts/IBMPlexSansJP-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansJP-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansJP-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "brand/icons/app-icon-ios-1024.png"
  adaptive_icon_background: "#264F36"
  adaptive_icon_foreground: "brand/icons/adaptive-foreground-1024.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4F7F4"
  image: "brand/icons/splash-logo-light.png"
  color_dark: "#101613"
  image_dark: "brand/icons/splash-logo-dark.png"
  android_12:
    color: "#F4F7F4"
    image: "brand/icons/splash-logo-light.png"
    color_dark: "#101613"
    image_dark: "brand/icons/splash-logo-dark.png"
