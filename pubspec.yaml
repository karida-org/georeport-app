name: georeport
description: "Mobile client for GTT-Redmine: capture issues from photos and work on assigned issues in the field."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: any
  latlong2: ^0.10.1
  maplibre: ^0.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
