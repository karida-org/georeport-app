name: Release

# Tagged releases produce downloadable builds on the GitHub Release, so the
# app is installable before (and independently of) store publishing. When
# store publishing arrives, it becomes an extra job on top of these builds.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  # Keep in sync with ci.yml.
  FLUTTER_VERSION: 3.44.7

jobs:
  android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    env:
      # Secrets are not readable in step `if` expressions; presence is
      # computed here instead.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The upload keystore is optional: without the secrets the build falls
      # back to debug signing (see android/app/build.gradle.kts), which still
      # installs for early testers but is not accepted by app stores.
      - name: Set up release signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      # The tag names the user-facing version; the run number keeps the
      # Android versionCode monotonic without per-release pubspec bumps.
      - name: Build
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release \
            --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/georeport-$GITHUB_REF_NAME-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/georeport-$GITHUB_REF_NAME-android.aab"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: Build iOS (unsigned archive)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Without an Apple Developer signing setup this archive cannot be
      # installed directly; it is CI proof that the iOS build compiles at the
      # released revision and the input for a future TestFlight pipeline.
      - name: Build
        run: |
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          flutter build ipa --release --no-codesign \
            --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist
          (cd build/ios/archive && zip -qry \
            "$GITHUB_WORKSPACE/dist/georeport-$GITHUB_REF_NAME-ios-unsigned.xcarchive.zip" \
            Runner.xcarchive)

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Georeport $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
